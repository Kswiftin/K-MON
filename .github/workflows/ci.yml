name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    # Pull requests only. A squash-merged commit is the code this job already
    # checked on the PR, and macOS minutes bill at 10x against a private repo —
    # re-running it on main spent the month's allowance in five days.
    if: github.event_name == 'pull_request'
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        run: ./scripts/test-gate.sh

  secret-scan:
    name: secret-scan
    # Same reason as build-test: the PR range already covers what lands on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        # gitleaks-action requires a paid GITLEAKS_LICENSE for organization repos.
        # The open-source CLI scans only commits introduced by this PR/push; scanning the
        # entire inherited history would fail forever on an old test-string false positive.
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ && "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]]
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="$SCAN_BASE..$SCAN_HEAD" --redact --verbose --no-banner /repo

  publish-development:
    name: publish-development
    # Still runs on every push to main — this is what keeps the rolling
    # development pre-release current, and it is not a duplicate of anything.
    #
    # `needs` is gone with the jobs it named: they no longer run on push, and a
    # skipped dependency skips its dependents, which would have silently stopped
    # publishing. What lands on main arrived through a PR that ran both, and a
    # tagged release re-runs the gate anyway (release.yml).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import stable macOS signing identity
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$SIGNING_CERTIFICATE_P12" && -n "$SIGNING_CERTIFICATE_PASSWORD" ]] || {
            echo "Stable macOS signing secrets are missing." >&2
            exit 1
          }
          keychain_path="$RUNNER_TEMP/kmon-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/kmon-signing.p12"
          certificate_pem="$RUNNER_TEMP/kmon-signing.pem"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          /usr/bin/openssl pkcs12 -in "$certificate_path" -clcerts -nokeys \
            -passin "pass:$SIGNING_CERTIFICATE_PASSWORD" -out "$certificate_pem"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          certificate_sha1="$(/usr/bin/openssl x509 -in "$certificate_pem" \
            -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$certificate_pem"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F '"K-MON Release"'
          echo "CI_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "CI_SIGNING_CERT_SHA1=$certificate_sha1" >> "$GITHUB_ENV"

      - name: Build installable app
        env:
          KMON_VERSION: 2.7.${{ github.run_number }}
          KMON_SOURCE_COMMIT: ${{ github.sha }}
          KMON_SKIP_INSTALL: "1"
          # 이 채널의 버전(2.7.x)은 릴리스 채널(2.15.x)보다 낮다 — 업데이터를 켜 두면 테스트 빌드가
          # 실행 직후 자신을 정식 릴리스로 덮어쓴다(실제로 그렇게 테스트 빌드가 사라졌다).
          KMON_DISABLE_UPDATER: "1"
          KMON_GITHUB_OAUTH_CLIENT_ID: ${{ vars.KMON_GITHUB_OAUTH_CLIENT_ID }}
          CODESIGN_IDENTITY: K-MON Release
        run: ./scripts/build-app.sh

      - name: Package and checksum
        run: |
          ditto -c -k --keepParent build/Pokédoro.app build/Pokedoro.zip
          # build 안에서 만들어야 체크섬 파일에 "build/" 경로가 안 박힌다 —
          # 받는 쪽은 zip 옆에서 `shasum -c Pokedoro.zip.sha256` 를 돌리므로 경로가 붙으면 검증이 실패한다.
          (cd build && shasum -a 256 Pokedoro.zip > Pokedoro.zip.sha256)

      - name: Update rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f development "$GITHUB_SHA"
          git push --force origin refs/tags/development
          if gh release view development >/dev/null 2>&1; then
            gh release upload development build/Pokedoro.zip build/Pokedoro.zip.sha256 --clobber
            gh release edit development --target "$GITHUB_SHA" --prerelease \
              --title "K-MON Development" \
              --notes "Automated development build from main at $GITHUB_SHA. Tests and secret scan passed."
          else
            gh release create development build/Pokedoro.zip build/Pokedoro.zip.sha256 \
              --target "$GITHUB_SHA" --prerelease --title "K-MON Development" \
              --notes "Automated development build from main at $GITHUB_SHA. Tests and secret scan passed."
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${CI_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CI_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${CI_SIGNING_CERT_SHA1:-}" ]]; then
            sudo security delete-certificate -Z "$CI_SIGNING_CERT_SHA1" \
              /Library/Keychains/System.keychain || true
          fi
