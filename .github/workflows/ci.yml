name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        run: ./scripts/test-gate.sh

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        # The action wrapper requires a paid license for organization-owned
        # repositories. Run the same official scanner directly instead.
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.28.0
        with:
          args: detect --source=/github/workspace --redact --no-banner

  publish-development:
    name: publish-development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, secret-scan]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build installable app
        env:
          KMON_VERSION: 999.${{ github.run_number }}.0
          KMON_SOURCE_COMMIT: ${{ github.sha }}
          KMON_UPDATE_CHANNEL: development
          KMON_SKIP_INSTALL: "1"
        run: ./scripts/build-app.sh

      - name: Package, sign, and generate development appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "SPARKLE_PRIVATE_KEY is missing" >&2; exit 1; }
          mkdir -p build/development-feed
          ditto -c -k --keepParent build/Pokédoro.app build/development-feed/Pokedoro.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/Kswiftin/K-MON/releases/download/development/" \
              --link "https://github.com/Kswiftin/K-MON/releases/tag/development" \
              --maximum-versions 1 \
              -o build/development-feed/appcast.xml \
              build/development-feed
          (cd build/development-feed && shasum -a 256 Pokedoro.zip > Pokedoro.zip.sha256)
          grep -F 'sparkle:edSignature=' build/development-feed/appcast.xml >/dev/null

      - name: Update rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f development "$GITHUB_SHA"
          git push --force origin refs/tags/development
          if gh release view development >/dev/null 2>&1; then
            gh release upload development build/development-feed/Pokedoro.zip \
              build/development-feed/Pokedoro.zip.sha256 build/development-feed/appcast.xml --clobber
            gh release edit development --target "$GITHUB_SHA" --prerelease \
              --title "K-MON Development" \
              --notes "Automated development build from main at $GITHUB_SHA. Tests and secret scan passed."
          else
            gh release create development build/development-feed/Pokedoro.zip \
              build/development-feed/Pokedoro.zip.sha256 build/development-feed/appcast.xml \
              --target "$GITHUB_SHA" --prerelease --title "K-MON Development" \
              --notes "Automated development build from main at $GITHUB_SHA. Tests and secret scan passed."
          fi
