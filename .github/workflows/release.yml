name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build-sign-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and target
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]] || {
            echo "Release tag must point at the current origin/main commit." >&2
            exit 1
          }
          [[ -n "$version" ]]

      - name: Require Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "SPARKLE_PRIVATE_KEY Actions secret is missing." >&2
            exit 1
          }

      - name: Import stable macOS signing identity
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$SIGNING_CERTIFICATE_P12" && -n "$SIGNING_CERTIFICATE_PASSWORD" ]] || {
            echo "Stable macOS signing secrets are missing." >&2
            exit 1
          }
          keychain_path="$RUNNER_TEMP/kmon-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/kmon-signing.p12"
          certificate_pem="$RUNNER_TEMP/kmon-signing.pem"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          /usr/bin/openssl pkcs12 -in "$certificate_path" -clcerts -nokeys \
            -passin "pass:$SIGNING_CERTIFICATE_PASSWORD" -out "$certificate_pem"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # 사용자 trust 설정은 headless runner에서 GUI 승인을 기다리며 멈춘다.
          # runner의 임시 System Keychain에 비대화식으로 신뢰하고 작업 종료 때 제거한다.
          certificate_sha1="$(/usr/bin/openssl x509 -in "$certificate_pem" \
            -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$certificate_pem"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F '"K-MON Release"'
          echo "CI_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "CI_SIGNING_CERT_SHA1=$certificate_sha1" >> "$GITHUB_ENV"

      - name: Require GitHub OAuth Client ID
        env:
          KMON_GITHUB_OAUTH_CLIENT_ID: ${{ vars.KMON_GITHUB_OAUTH_CLIENT_ID }}
        run: |
          [[ -n "$KMON_GITHUB_OAUTH_CLIENT_ID" ]] || {
            echo "KMON_GITHUB_OAUTH_CLIENT_ID Actions variable is missing." >&2
            exit 1
          }

      - name: Test and coverage gate
        run: ./scripts/test-gate.sh

      - name: Build installable app
        env:
          KMON_VERSION: ${{ github.ref_name }}
          KMON_SOURCE_COMMIT: ${{ github.sha }}
          KMON_SKIP_INSTALL: "1"
          KMON_GITHUB_OAUTH_CLIENT_ID: ${{ vars.KMON_GITHUB_OAUTH_CLIENT_ID }}
          CODESIGN_IDENTITY: K-MON Release
          PTB_REQUIRE_STABLE_SIGN: "1"
        run: |
          export KMON_VERSION="${KMON_VERSION#v}"
          ./scripts/build-app.sh

      - name: Verify embedded updater and app signature
        run: |
          test -d build/Pokédoro.app/Contents/Frameworks/Sparkle.framework
          otool -L build/Pokédoro.app/Contents/MacOS/PokeTokenBar | grep -F '@rpath/Sparkle.framework'
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' build/Pokédoro.app/Contents/Info.plist >/dev/null
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :KMONGitHubOAuthClientID' build/Pokédoro.app/Contents/Info.plist)"
          # 서명 신원 검사는 로컬 빌드와 같은 한 벌을 쓴다. 여기에 grep 을 다시 적으면
          # 두 벌이 되어, 한쪽만 느슨해져도 아무것도 안 깨진다.
          ./scripts/verify-signing-identity.sh build/Pokédoro.app

      - name: Package and generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p build/release-feed
          ditto -c -k --keepParent build/Pokédoro.app build/release-feed/Pokedoro.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/Kswiftin/K-MON/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/Kswiftin/K-MON/releases/tag/$GITHUB_REF_NAME" \
              --maximum-versions 1 \
              -o build/release-feed/appcast.xml \
              build/release-feed
          (cd build/release-feed && shasum -a 256 Pokedoro.zip > Pokedoro.zip.sha256)
          # OAuth 인증을 붙이기 위해 앱이 enclosure URL을 로컬에서 치환하므로 feed 파일 자체는
          # 서명하지 않는다. 설치 파일의 EdDSA 서명은 반드시 유지·검증한다.
          grep -F 'sparkle:edSignature=' build/release-feed/appcast.xml >/dev/null
          grep -F "/releases/download/$GITHUB_REF_NAME/Pokedoro.zip" build/release-feed/appcast.xml >/dev/null

      # Release is created only after every build, signature and feed check succeeds,
      # so clients never observe a published semantic version with missing assets.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release-feed/Pokedoro.zip \
            build/release-feed/Pokedoro.zip.sha256 \
            build/release-feed/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "K-MON $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${CI_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CI_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${CI_SIGNING_CERT_SHA1:-}" ]]; then
            sudo security delete-certificate -Z "$CI_SIGNING_CERT_SHA1" \
              /Library/Keychains/System.keychain || true
          fi
